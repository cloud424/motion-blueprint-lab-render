name: EP05 | Real-footage rights and duration preflight
on:
  push:
    paths:
      - 'episodes/EP05_HydraulicExcavator_Plan.json'
      - 'scripts/ep05_acquire_footage.py'
      - '.github/workflows/ep05_preflight.yml'
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 0,2,4"
permissions:
  contents: read
concurrency:
  group: mbl-EP05-preproduction
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install inspection tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m py_compile scripts/ep05_acquire_footage.py
      - name: Fetch unique real-footage sources and verify video durations
        run: python scripts/ep05_acquire_footage.py
      - name: Keep private footage inventory even when blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EP05_source_acquisition_pending_QA
          path: out_EP05_ingest/
          retention-days: 7
          if-no-files-found: warn
