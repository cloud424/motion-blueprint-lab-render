name: EP05 R3 | Acquire Diverse Footage No Repeats
on:
  push:
    paths:
      - 'scripts/acquire_EP05_R3_no_repeats.py'
      - '.github/workflows/acquire_EP05_R3.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mbl-ep05-r3-footage
  cancel-in-progress: true
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - name: Install ffprobe and verify script
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m py_compile scripts/acquire_EP05_R3_no_repeats.py
      - name: Acquire rights-documented unique hydropower views
        run: |
          python scripts/acquire_EP05_R3_no_repeats.py
      - name: Upload private footage, exact Pexels source URLs
        uses: actions/upload-artifact@v4
        with:
          name: EP05_R3_UNIQUE_REAL_FOOTAGE
          path: |
            out_EP05_R3_NEW_CLIPS/*.mp4
            out_EP05_R3_NEW_CLIPS/*.json
          retention-days: 5
          if-no-files-found: error
