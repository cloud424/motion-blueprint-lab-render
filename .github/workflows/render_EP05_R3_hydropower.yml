name: EP05 R3 | Render Hydropower Documentary Private QA
on:
  workflow_run:
    workflows:
      - "EP05 R3 | Acquire Supplementary Hydropower Footage"
    types:
      - completed
  workflow_dispatch:
  push:
    paths:
      - 'scripts/render_EP05_hydropower_R3.py'
      - '.github/workflows/render_EP05_R3_hydropower.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: mbl-ep05-r3-render
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and validate EP05 source storyboard
        run: |
          python -m py_compile scripts/render_EP05_hydropower_R3.py
          python - <<'PY'
          import json
          x=json.load(open('episodes/EP05_Hydropower_R3.json'))
          assert len(x['scenes']) == 12
          assert sum(s['type']=='real' for s in x['scenes']) == 9
          assert sum(s['type']=='animation' for s in x['scenes']) == 3
          print('EP05 script syntax and 12-scene blueprint PASS')
          PY
  render:
    needs: [validate]
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ffmpeg and open-weight English narration
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng libgl1
          python -m pip install --disable-pip-version-check "torch==2.7.1" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check "kokoro==0.9.4" "soundfile>=0.12" "numpy<3" "Pillow>=10"
          python -m py_compile scripts/render_EP05_hydropower_R3.py
      - name: Restore exact source-acquisition artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out_EP05_R3_NEW_CLIPS
          ACQUIRE_RUN="$(gh run list --repo cloud424/motion-blueprint-lab-render --workflow acquire_EP05_R3.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            SUPPLEMENT_RUN="${{ github.event.workflow_run.id }}"
          else
            SUPPLEMENT_RUN="$(gh run list --repo cloud424/motion-blueprint-lab-render --workflow acquire_EP05_R3_supplement.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          if [ -z "$ACQUIRE_RUN" ] || [ -z "$SUPPLEMENT_RUN" ]; then
            echo "Both unique main and supplementary licensed acquisition runs required" >&2
            exit 1
          fi
          gh run download "$ACQUIRE_RUN" --repo cloud424/motion-blueprint-lab-render --name EP05_R3_UNIQUE_REAL_FOOTAGE --dir out_EP05_R3_NEW_CLIPS
          mkdir -p out_EP05_R3_SUPP
          gh run download "$SUPPLEMENT_RUN" --repo cloud424/motion-blueprint-lab-render --name EP05_R3_SUPPLEMENTAL_FOOTAGE --dir out_EP05_R3_SUPP
          test -s out_EP05_R3_NEW_CLIPS/EP05_R3_New_Footage_Manifest.json
          test -s out_EP05_R3_SUPP/EP05_R3_Supplement_Manifest.json
          python - <<'PY'
          import json, shutil, pathlib
          main=pathlib.Path("out_EP05_R3_NEW_CLIPS")
          supp=pathlib.Path("out_EP05_R3_SUPP")
          path=main/"EP05_R3_New_Footage_Manifest.json"
          m=json.loads(path.read_text())
          x=json.loads((supp/"EP05_R3_Supplement_Manifest.json").read_text())
          names={r["slug"] for r in m}
          ids={str(r["pexels_id"]) for r in m}
          for rec in x:
              if rec["slug"] in names or str(rec["pexels_id"]) in ids:continue
              source=supp/(rec["slug"]+".mp4")
              assert source.is_file() and source.stat().st_size>100000,source
              shutil.copyfile(source,main/source.name)
              m.append(rec)
              names.add(rec["slug"])
              ids.add(str(rec["pexels_id"]))
          path.write_text(json.dumps(m,indent=2,ensure_ascii=False))
          print("EP05 DISTINCT VALID SOURCE FILES",len(m))
          assert len(m)>=9,"Not enough unique footage for documentary"
          PY
      - name: Render 9 real clips once plus 3 original mechanical cutaways
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          HF_HUB_DOWNLOAD_TIMEOUT: "120"
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: |
          python scripts/render_EP05_hydropower_R3.py
      - name: Final safety gate and source proof
        run: |
          test -s out_EP05_R3/EP05_Hydropower_R3_Documentary_173s_PRIVATE_QA.mp4
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path("out_EP05_R3/EP05_R3_Technical_Source_QA.json")
          d=json.loads(p.read_text())
          assert d["published"] is False
          assert d["qa_approval"] == "pending"
          assert d["real_ratio"] >= 0.75
          assert d["unique_source_ids"] == 9
          assert d["distinct_original_mechanisms"] == 3
          assert 172 <= d["duration"] <= 175
          assert len(set(x["pexels_id"] for x in d["credits"])) == 9
          print("PASS: EP05 source, duration, and no-repeat gates; publication remains blocked")
          PY
      - name: Private preview master and actual 12-shot proof
        uses: actions/upload-artifact@v4
        with:
          name: EP05_R3_HYDROPOWER_PRIVATE_QA
          path: |
            out_EP05_R3/EP05_Hydropower_R3_Documentary_173s_PRIVATE_QA.mp4
            out_EP05_R3/EP05_R3_Actual12Shot_Storyboard.jpg
            out_EP05_R3/EP05_R3_Technical_Source_QA.json
            out_EP05_R3/EP05_English_Subtitles.srt
          retention-days: 10
          if-no-files-found: error
