name: EP02 | compare TikTok real page with missing video
on:
  push:
    paths:
      - '.github/workflows/verify_EP02_tiktok_page.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Compare public native video-page metadata against a nonexistent-video control
        run: |
          python - <<'PY'
          import urllib.request,urllib.error,re,hashlib
          for label,video_id in [('candidate','7708183756598758663'),('missing_control','7708183756598758999')]:
            url='https://www.tiktok.com/@trisportpulse/video/'+video_id+'?lang=en'
            req=urllib.request.Request(url,headers={
              'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/132.0.0.0 Safari/537.36',
              'Accept':'text/html,application/xhtml+xml',
              'Accept-Language':'en-US,en;q=0.9'})
            try:
              with urllib.request.urlopen(req,timeout=22) as resp:
                html=resp.read(750000).decode('utf8','replace')
                title=re.search(r'<title[^>]*>(.*?)</title>',html,re.I|re.S)
                og=re.search(r'<meta[^>]*property="og:title"[^>]*content="([^"]*)"',html,re.I)
                markers={k:(k in html) for k in ['SIGI_STATE','__UNIVERSAL_DATA_FOR_REHYDRATION__','video-detail','itemInfo',video_id]}
                print(label,'HTTP',resp.status,'URL',resp.url,'bytes',len(html),'sha256',hashlib.sha256(html.encode()).hexdigest()[:14],
                  'title',title.group(1)[:140] if title else None,'og',og.group(1)[:140] if og else None,'markers',markers,flush=True)
            except urllib.error.HTTPError as ex:
              print(label,'HTTP error',ex.code,'URL',ex.url,flush=True)
            except Exception as ex:
              print(label,'unverified',type(ex).__name__,str(ex)[:180],flush=True)
          PY
