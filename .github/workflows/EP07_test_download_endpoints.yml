name: EP07 | Free Footage Endpoint Diagnostic (PRIVATE)
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/EP07_test_download_endpoints.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install yt-dlp (free), probe actual provider metadata and video formats only
        run: |
          python -m pip install -q --disable-pip-version-check yt-dlp
          yt-dlp --version
          for url in \
            'https://www.pexels.com/video/traditional-sugar-manufacturing-process-37283360/' \
            'https://www.pexels.com/video/traditional-sugarcane-juice-extraction-outdoor-scene-36414457/' \
            'https://www.pexels.com/video/aerial-view-of-lush-green-sugarcane-field-40799964/' \
            'https://www.pexels.com/video/man-working-with-machine-for-sugar-cane-10057136/' \
            'https://commons.wikimedia.org/wiki/File:Process_of_Making_Granular_Jaggery.webm' \
            'https://pixabay.com/videos/search/sugarcane%20juice/'
          do
            echo "::group::PROBE $url"
            timeout 42s yt-dlp --simulate --skip-download --no-playlist \
              --print 'EXTRACTED id=%(id)s duration=%(duration)s formats=%(formats)l' \
              --no-warnings "$url" 2>&1 | head -c 900 || true
            echo
            echo "::endgroup::"
          done
      - name: Test provider-supported browser impersonation and licensed Commons download
        run: |
          python -m pip install -q --disable-pip-version-check "yt-dlp[curl-cffi]"
          for url in \
            'https://www.pexels.com/video/traditional-sugar-manufacturing-process-37283360/' \
            'https://www.pexels.com/video/traditional-sugarcane-juice-extraction-outdoor-scene-36414457/' \
            'https://www.pexels.com/video/aerial-view-of-lush-green-sugarcane-field-40799964/'
          do
            echo "::group::OFFICIAL_SITE $url"
            timeout 45s yt-dlp --impersonate chrome --simulate --no-playlist --no-warnings \
              --print 'RESOLVED id=%(id)s title=%(title)s duration=%(duration)s' "$url" 2>&1 | head -c 700 || true
            echo
            echo "::endgroup::"
          done
          mkdir -p /tmp/ep07_verified
          echo "::group::COMMONS_BY3_DOCUMENTARY_REAL_BYTES"
          timeout 120s yt-dlp --no-playlist --no-warnings --impersonate chrome \
            -f "best[height<=360]/worst" \
            -o '/tmp/ep07_verified/commons_granular_jaggery.%(ext)s' \
            'https://commons.wikimedia.org/wiki/File:Process_of_Making_Granular_Jaggery.webm' 2>&1 | tail -c 1400 || true
          ls -lh /tmp/ep07_verified || true
          echo "::endgroup::"
