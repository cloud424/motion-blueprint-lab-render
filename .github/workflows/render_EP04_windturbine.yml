name: EP04 | Wind Turbine Multi-View Cinematic Private Review
on:
  push:
    paths:
      - 'scripts/render_EP04_windturbine.py'
      - '.github/workflows/render_EP04_windturbine.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: motion-blueprint-ep04-private-review
  cancel-in-progress: false
jobs:
  render-review:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free voice + original mechanics renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng libgl1
          python -m pip install --disable-pip-version-check "torch==2.7.1" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check "kokoro==0.9.4" "soundfile>=0.12" "numpy<3" "Pillow>=10" "opencv-python-headless>=4.9"
          python -m py_compile scripts/render_EP04_windturbine.py
      - name: Produce EP04 with verified commercial-use real wind-turbine footage
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          HF_HUB_DOWNLOAD_TIMEOUT: "120"
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: |
          python scripts/render_EP04_windturbine.py
      - name: Inspect final video, full stream decode, audio, frame size
        run: |
          f=out_EP04/EP04_WindTurbine_InsideTheMachine_173s_PRIVATE_PREVIEW_720p.mp4
          test -s "$f"
          ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height -of json "$f"
          ffmpeg -v error -i "$f" -f null -
      - name: Deliver private video, engineering storyboard and source proof
        uses: actions/upload-artifact@v4
        with:
          name: EP04_WindTurbine_CINEMATIC_PRIVATE_REVIEW
          path: |
            out_EP04/EP04_WindTurbine_InsideTheMachine_173s_PRIVATE_PREVIEW_720p.mp4
            out_EP04/EP04_12Shot_ActualVideo_ContactSheet.jpg
            out_EP04/EP04_Source_License_QA.json
            out_EP04/EP04_Script_English.txt
          if-no-files-found: error
          retention-days: 14
