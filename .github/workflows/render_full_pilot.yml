name: EP02 | 3-minute private engineering pilot
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/render_EP02_pilot.py"
      - ".github/workflows/render_full_pilot.yml"
permissions:
  contents: read
concurrency:
  group: motion-blueprint-ep02-full-preview
  cancel-in-progress: false
jobs:
  ep02-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/render_EP02_pilot.py
      - name: Install FFmpeg and free licensed voice renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng
          python -m pip install --disable-pip-version-check "torch==2.5.1" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check "kokoro==0.9.4" "soundfile>=0.12" "numpy<3" "Pillow>=10.0"
          python -m py_compile scripts/render_EP02_pilot.py
      - name: Generate original EP02 video with US Navy public-domain footage
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          HF_HUB_DOWNLOAD_TIMEOUT: "120"
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: |
          python scripts/render_EP02_pilot.py --outdir out
      - name: Decode and verify output
        run: |
          f=out/EP02_PanamaCanal_GravityLocks_3min_Preview_720p.mp4
          test -s "$f"
          ffmpeg -v error -i "$f" -f null -
          ffprobe -v error -show_entries format=duration,size -of json "$f"
      - name: Save review MP4 and verification metadata
        uses: actions/upload-artifact@v4
        with:
          name: EP02_PanamaCanal_3min_PRIVATE_REVIEW
          path: |
            out/EP02_PanamaCanal_GravityLocks_3min_Preview_720p.mp4
            out/EP02_PanamaCanal_GravityLocks_Preview_Report.json
            out/timings.json
          if-no-files-found: error
          retention-days: 14
