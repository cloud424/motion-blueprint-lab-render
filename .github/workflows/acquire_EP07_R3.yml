name: EP07 R3 | Private Sugarcane Source Acquisition and QA
on:
  workflow_dispatch:
  # Independent free-source retry when a prior acquisition failed; UTC every 6h.
  schedule:
    - cron: '10 1,7,13,19 * * *'
  push:
    paths:
      - 'scripts/acquire_EP07_R3_sources.py'
      - 'episodes/EP07_Source_Candidates.json'
      - '.github/workflows/acquire_EP07_R3.yml'
permissions:
  contents: read
concurrency:
  group: mbl-ep07-source-acquisition
  cancel-in-progress: true
jobs:
  source_acquisition:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate acquisition code and source candidate JSON
        run: |
          python -m py_compile scripts/acquire_EP07_R3_sources.py
          python - <<'PY'
          import json
          r=json.load(open('episodes/EP07_Source_Candidates.json'))
          assert r['episode']=='EP07'
          ids=[x['id'] for x in r['source_candidates']]
          assert len(ids)==len(set(ids)) and len(ids)>=8
          print('Source candidate list schema checked, not rights approval')
          PY
      - name: Install free portable FFmpeg
        run: python -m pip install -q --disable-pip-version-check imageio-ffmpeg
      - name: Check whether EP07 source stage is still needed
        id: pending
        run: |
          python - <<'PY'
          import json, os
          x=json.load(open('episodes/EP07_Recovery_State.json'))
          stage=str(x.get('stage',''))
          status=str(x.get('status',''))
          done=bool(x.get('four_site_public_verified')) or stage in ('render_qa','cloudinary_staging','publication_verification','published') or status.startswith('published')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('needed='+str(not done).lower()+'\n')
          print('EP07 private source acquisition needed:',not done)
          PY
      - name: Restore last same-repository source artifact for SHA-256 verified reuse
        if: steps.pending.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out_EP07_sources
          PREV="$(gh run list --repo cloud424/motion-blueprint-lab-render --workflow acquire_EP07_R3.yml --status failure --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            echo "Attempting private source cache restore from completed run $PREV"
            gh run download "$PREV" --repo cloud424/motion-blueprint-lab-render --name EP07_R3_REAL_CRAFT_SOURCES_PRIVATE --dir out_EP07_sources || echo "No reusable source cache; continue normally"
          fi
      - name: Download and decode distinct genuine candidate videos with bounded retries
        if: steps.pending.outputs.needed == 'true'
        run: python scripts/acquire_EP07_R3_sources.py
      - name: Preserve private source files and true error report even on failure
        if: always() && steps.pending.outputs.needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: EP07_R3_REAL_CRAFT_SOURCES_PRIVATE
          path: |
            out_EP07_sources/EP07_Source_Acquisition_Report.json
            out_EP07_sources/*.mp4
          retention-days: 7
          if-no-files-found: warn
